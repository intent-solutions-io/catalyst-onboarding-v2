[project]
name = "catalyst-onboarding-v2"
version = "0.1.0"
description = "Catalyst v2 onboarding platform (Django). Planning-stage skeleton; see 000-docs/011."
requires-python = "==3.14.*"
license = "Apache-2.0"

# Dependencies are installed from the hash-locked requirements/*.txt files, not from this file.

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-p no:cacheprovider --strict-markers"
markers = ["worker_setup: the set-up runs the worker, so the human-only tripwire is armed after it (tests/test_human_only.py)"]

# Python lint (bead catalyst-v2-9kg.46; 009 section 5.1). Ruff's default rule set only (E4, E7, E9, F: syntax,
# undefined and unused names, import and comparison mistakes): no formatting, no import ordering, no type checking,
# until the owner asks. Scope: every tracked Python file (the Django packages, config, scripts, tests, manage.py).
[tool.ruff]
target-version = "py314"
extend-exclude = [".beads", "000-docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Test modules import fixtures from other test modules so pytest registers them (the `# noqa: F401 (fixture chain)`
# imports), then name those fixtures as test parameters; ruff reads each such parameter as a redefinition.
"tests/*" = ["F811"]
