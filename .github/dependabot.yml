version: 2
updates:
  # Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10

  # Language: generic — the skill will select the correct ecosystem
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    ignore:
      # ADR-17 / D-18 pin the Django 5.2 LTS line. A major-version move (6.x is not LTS) is an owner
      # decision with its own migration PR, never an automated bump. Security and patch releases of 5.2 still arrive.
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]
