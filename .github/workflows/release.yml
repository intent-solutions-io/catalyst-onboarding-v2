name: Release

# Bead catalyst-v2-oyu. A release publishes an already-tested, already-merged commit and writes nothing to the
# repository's history. The version and changelog change is an ordinary reviewed pull request
# (scripts/prepare_release.py). This workflow only checks that commit and asks GitHub to create the release with the
# tag created server-side on exactly that commit: it never commits, tags locally or pushes.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version already merged in version.txt and CHANGELOG.md, e.g. v0.4.0"
        required: true
        type: string
      dry_run:
        description: "Check only; do not create the release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write  # gh release create, which also creates the tag on the given commit
  checks: read  # the release gate reads the commit's CI check runs

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    # Only main's own workflow file and scripts may release (an older ref could carry an older workflow).
    if: github.ref == 'refs/heads/main'
    # The protected release environment (009 section 5.5, P6-D-5): its reviewer and main-only branch policy are
    # applied by the owner with scripts/apply-github-protections.sh; until then the environment carries no rule.
    environment: release
    runs-on: ubuntu-latest
    env:
      # The dispatcher's text reaches steps only through this variable, never interpolated into a script.
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate the version input
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like v1.2.3"; exit 1; }

      - name: Checkout the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the version, changelog and merged commit
        run: python3 scripts/release_check.py "$VERSION" "$GITHUB_SHA"

      # Bead catalyst-v2-2xy. Tests are not re-run here: CI is the one source of test truth. The gate fails closed
      # (missing, running, failed, cancelled or skipped checks all refuse), and a failed step stops the job.
      - name: Require green CI on the release commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/require_green_ci.py "$GITHUB_SHA"

      - name: Extract the changelog entry
        run: |
          python3 - "$VERSION" > "$RUNNER_TEMP/notes.md" <<'PY'
          import re, sys
          text = open("CHANGELOG.md").read()
          match = re.search(rf"^## \[{re.escape(sys.argv[1])}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, flags=re.M | re.S)
          print(match[1].strip() if match else "")
          PY

      - name: Create GitHub Release
        if: inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Re-check the tag on the server: if it appeared since the first check, gh would reuse it and ignore --target.
          # --exit-code returns 2 only when the tag is absent; 0 means it exists and anything else is an error.
          rc=0; git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null || rc=$?
          [ "$rc" = 2 ] || { echo "::error::tag $VERSION exists on the server, or the check failed (exit $rc)"; exit 1; }
          gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "catalyst-onboarding-v2 $VERSION" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Dry run summary
        if: inputs.dry_run == true
        run: |
          echo "::notice::Dry run: $VERSION may be released from $GITHUB_SHA"
          echo "- **Version:** $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit:** $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
