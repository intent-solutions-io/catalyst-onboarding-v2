name: Image

# The deployable image (026 section 9, H6; 6B.10). On every pull request: build the production target, check that it
# carries no tests, history or tracker, produce a software bill of materials, and scan it. On main only, in a separate
# job that alone holds the signing permissions (PR #73 review): attest the exact image tarball with this repository's
# workflow identity and keep it as the build artifact. Nothing is pushed to a registry; the host's deploy step verifies
# the attestation on a private copy and loads that copy (scripts/verify_image_attestation.sh).
# Not a required check: the merge guard's required checks are unchanged (009 section 5.5).
#
# Scan policy (recorded in 026 section 16 for the owner): a fixable high or critical finding fails the build; unfixed
# findings are listed but do not fail it; there is no waiver file yet.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and scan the image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the production image
        run: |
          docker build --target production --build-arg "CATALYST_COMMIT=${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "catalyst:${GITHUB_SHA}" .
          docker save "catalyst:${GITHUB_SHA}" -o catalyst-image.tar

      - name: The image carries the application only (TEST-P6-37)
        run: |
          set -euo pipefail
          found="$(docker run --rm --network none --entrypoint sh "catalyst:${GITHUB_SHA}" -c \
            'find / -xdev \( -name .git -o -name .beads -o -path /app/tests \) 2>/dev/null | head -5')"
          [ -z "$found" ] || { echo "unexpected content: $found"; exit 1; }
          [ "$(docker run --rm --network none --entrypoint cat "catalyst:${GITHUB_SHA}" /app/COMMIT)" = "$GITHUB_SHA" ]

      - name: Software bill of materials
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: catalyst:${{ github.sha }}
          format: spdx-json
          output-file: catalyst-image.spdx.json
          upload-artifact: false

      - name: Vulnerability scan (fixable high and critical fail the build)
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: catalyst-image.spdx.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table

      - name: Hand the image to the attestation job
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: catalyst-image-${{ github.sha }}
          path: |
            catalyst-image.tar
            catalyst-image.spdx.json
          retention-days: 30
          if-no-files-found: error

  attest:
    name: Attest the image (main only)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read        # download the build job's artifact
      id-token: write      # the attestation's signing identity
      attestations: write  # the attestation's record
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: catalyst-image-${{ github.sha }}

      - name: Attest the image tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: catalyst-image.tar
