name: CI

# Existing required check names remain stable. Four isolated shards execute the complete suite;
# runtime verifies their combined evidence. Fast checks start alongside the shards (9kg.93).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel a superseded run of the same workflow on the same PR. Pushes to main use the run id, so
# they never cancel each other. Never copy this onto a deployment workflow.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  shards:
    name: Test shard ${{ matrix.shard }}/4
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    # The full suite took about 10 minutes on a hosted runner at 3B.2 (760 tests) and 18 to 20 minutes by 6B.12
    # (October 2026, about 1,300 tests, main's runs measured); 35 leaves headroom while a run that hangs still ends.
    timeout-minutes: 35
    # Same digest-pinned images as compose.yaml (ADR-17, D-18).
    container:
      image: python:3.14.10-slim@sha256:3cabfd7d7aaf394e6040e79fa1eec6ca1c52b74ed9188650472695d9a9326999
    services:
      postgres:
        image: postgres:16.15@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          POSTGRES_DB: catalyst
          POSTGRES_USER: catalyst_admin
          POSTGRES_PASSWORD: synthetic-ci-admin-only
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1g
          --health-cmd "pg_isready -U catalyst_admin -d catalyst"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      PIP_CACHE_DIR: /tmp/catalyst-pip-cache
      PYTHONDONTWRITEBYTECODE: "1"
      CATALYST_ENV: test
      CATALYST_SECRET_KEY: synthetic-ci-only
      CATALYST_DB_NAME: catalyst
      CATALYST_DB_USER: catalyst_owner
      CATALYST_DB_PASSWORD: synthetic-ci-owner-only
      CATALYST_DB_HOST: postgres
      CATALYST_DB_PORT: "5432"
      CATALYST_CHALLENGE_LIFETIME_SECONDS: "3600"  # synthetic; POL-02 open
      CATALYST_PUBLIC_BASE_URL: "http://catalyst.example.test"  # synthetic; never contacted
      CATALYST_VERIFICATION_KEY: synthetic-ci-verification-key-only
      CATALYST_DB_OWNER_PASSWORD: synthetic-ci-owner-only
      # The bootstrap administrator's login is set on the provisioning step only (6hl.10). The probe pair below is
      # read by test code alone, for the superuser-refusal probes and the tests that must act as the administrator.
      CATALYST_TEST_SUPERUSER_PROBE_USER: catalyst_admin
      CATALYST_TEST_SUPERUSER_PROBE_PASSWORD: synthetic-ci-admin-only
      CATALYST_DB_APP_PASSWORD: synthetic-ci-app-only
      CATALYST_DB_RETENTION_PASSWORD: synthetic-ci-retention-only
      CATALYST_DB_BACKUP_PASSWORD: synthetic-ci-backup-only
      CATALYST_DB_FETCHER_PASSWORD: synthetic-ci-fetcher-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore Python download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/catalyst-pip-cache
          key: ${{ runner.os }}-${{ runner.arch }}-pip-dev-py314-${{ hashFiles('requirements/base.txt', 'requirements/dev.txt') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pip-dev-py314-

      - name: Install hash-locked dependencies
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet --disable-pip-version-check --require-hashes --no-deps -r requirements/dev.txt

      - name: Provision the database roles (ADR-14); the only step that holds the administrator login (6hl.10)
        env:
          CATALYST_DB_ADMIN_USER: catalyst_admin
          CATALYST_DB_ADMIN_PASSWORD: synthetic-ci-admin-only
        run: /tmp/venv/bin/python scripts/provision_db_roles.py

      - name: Test suite (PostgreSQL)
        run: /tmp/venv/bin/python -m pytest -v --durations=25 --ci-shard=${{ matrix.shard }}/4 --ci-shard-output=shard.json

      - name: Keep the shard evidence (required for aggregation)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: shard.json
          if-no-files-found: error
          retention-days: 7

  runtime:
    name: Runtime checks (Python 3.14.8, PostgreSQL 16.15)
    needs: shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard succeeded
        env:
          SHARDS_RESULT: ${{ needs.shards.result }}
        run: test "$SHARDS_RESULT" = success

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-shard-*-${{ github.run_attempt }}
          path: shard-results

      - name: Verify complete coverage and every acceptance gate
        run: python3 -m scripts.ci_shards shard-results --count 4 --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"

      # The combined register has the same schema as a local full run. Its archival upload remains optional;
      # shard transport above is mandatory because missing evidence must never produce a green runtime gate.
      - name: Keep the evidence register (register.json)
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-register
          path: register.json
          if-no-files-found: warn
          retention-days: 30

  docs:
    name: Markdown lint and doc index check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_CACHE_DIR: /tmp/catalyst-pip-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the secret scan

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

      - name: Every filed doc appears in 000-docs/000-INDEX.md
        run: bash scripts/check-docs.sh index

      - name: Restore static-tool download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/catalyst-pip-cache
          key: ${{ runner.os }}-${{ runner.arch }}-pip-tools-${{ hashFiles('requirements/docs.txt', 'requirements/lint.txt') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-pip-tools-

      - name: Agent definitions stay read-only and well formed
        run: |
          set -e
          python3 -m pip install --quiet --disable-pip-version-check --require-hashes --no-deps -r requirements/docs.txt
          python3 - <<'EOF'
          import glob, sys, yaml
          REQUIRED = {"name", "description", "tools", "disallowedTools", "model", "color", "version",
                      "author", "tags", "skills", "background", "hooks", "mcpServers", "permissionMode"}
          FORBIDDEN_TOOLS = {"Write", "Edit", "NotebookEdit", "Bash", "Agent", "Task", "Skill"}
          MODELS = {"sonnet", "haiku", "opus", "fable", "inherit"}
          errors = []
          files = sorted(glob.glob(".claude/agents/*.md"))
          for path in files:
              text = open(path, encoding="utf-8").read()
              parts = text.split("---", 2)
              if not text.startswith("---") or len(parts) < 3:
                  errors.append(f"{path}: no YAML frontmatter"); continue
              try:
                  fm = yaml.safe_load(parts[1]) or {}
              except yaml.YAMLError as exc:
                  errors.append(f"{path}: frontmatter does not parse: {exc}"); continue
              missing = REQUIRED - fm.keys()
              if missing:
                  errors.append(f"{path}: missing {sorted(missing)}")
              if fm.get("name") != path.split("/")[-1][:-3]:
                  errors.append(f"{path}: name does not match file name")
              tools = fm.get("tools") or ""
              tools = [t.strip() for t in (tools.split(",") if isinstance(tools, str) else tools)]
              granted = FORBIDDEN_TOOLS.intersection(tools)
              if granted:
                  errors.append(f"{path}: planning-stage agent grants {sorted(granted)}")
              denied = fm.get("disallowedTools")
              if not isinstance(denied, list) or "Agent" not in denied:
                  errors.append(f"{path}: disallowedTools must be a list that denies Agent")
              if fm.get("model") not in MODELS:
                  errors.append(f"{path}: model {fm.get('model')!r} not allowed")
              if fm.get("permissionMode") == "bypassPermissions":
                  errors.append(f"{path}: bypassPermissions is not allowed")
          print(f"checked {len(files)} agent definitions")
          for e in errors:
              print("ERROR", e)
          sys.exit(1 if errors else 0)
          EOF

      - name: Python lint and dependency audit (ruff, pip-audit; 009 section 5.1)
        # Bead catalyst-v2-9kg.46. Both tools are hash-locked in requirements/lint.txt; ruff's rules are set in
        # pyproject.toml; pip-audit reads the five locked requirement files without installing anything (--disable-pip
        # --no-deps) and fails on any known vulnerability, fixed or not. A waiver, if one is ever needed, is an explicit
        # --ignore-vuln <id> here with its reason. Measured 2026-10-23: see 009 section 5.3.
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check --require-hashes --no-deps -r requirements/lint.txt
          python3 -m ruff --version
          python3 -m ruff check --output-format concise .
          python3 -m pip_audit --version
          python3 -m pip_audit --disable-pip --no-deps --require-hashes --progress-spinner off \
            --cache-dir "$RUNNER_TEMP/pip-audit-cache" \
            -r requirements/base.txt -r requirements/dev.txt -r requirements/docs.txt -r requirements/lint.txt \
            -r requirements/browser.txt

      - name: Staged-file checker and hook integration
        run: python3 -m unittest scripts.test_fast_checks -v

      - name: Secret scan (gitleaks, full history)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .
