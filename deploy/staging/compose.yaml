      "restart": "unless-stopped",
      "depends_on": {
        "migrate": {
          "condition": "service_completed_successfully"
        }
      }
    },
    "egress": {
      "image": "${CATALYST_IMAGE:?the attested image digest}",
      "user": "10001:10001",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "tmpfs": [
        "/tmp:mode=1777,size=64m",
        "/dev/shm:mode=1777,size=64m"
      ],
      "environment": {
        "CATALYST_ENV": "staging",
        "CATALYST_EGRESS_LISTEN": "0.0.0.0:3128",
        "CATALYST_EGRESS_DENY_FILE": "/etc/catalyst/egress-deny"
      },
      "command": [
        "python",
        "-m",
        "assessments.egress"
      ],
      "networks": [
        "fetch",
        "egress"
      ],
      "restart": "unless-stopped",
      "volumes": [
        "./egress-deny:/etc/catalyst/egress-deny:ro"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-m",
          "assessments.egress",
          "--check"
        ],
        "interval": "10s",
        "timeout": "5s",
        "retries": 3
      }
    },
    "proxy": {
      "image": "caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d",
      "user": "10001:10001",
      "read_only": true,
      "cap_drop": [
        "ALL"
      ],
      "cap_add": [
        "NET_BIND_SERVICE"
      ],
      "environment": {
        "CATALYST_HTTPS_PORT": "8443",
        "CATALYST_PUBLIC_HOST": "${CATALYST_PUBLIC_HOST:?}",
        "CATALYST_PUBLIC_HOST_ALIASES": "${CATALYST_PUBLIC_HOST_ALIASES:-alias.staging.test}",
        "CATALYST_STAFF_HOST": "${CATALYST_STAFF_HOST:?}",
        "CATALYST_STAFF_PORT": "8444",
        "CATALYST_STAFF_BIND": "0.0.0.0"
      },
      "ports": [
        "${CATALYST_PUBLIC_PUBLISH:?}:${CATALYST_PUBLIC_PORT:-443}:8443",
        "${CATALYST_STAFF_PUBLISH:?a private address, never all interfaces}:${CATALYST_STAFF_PORT:-443}:8444"
      ],
      "volumes": [
        "./Caddyfile:/etc/caddy/Caddyfile:ro",
        "catalyst-run:/run/catalyst:ro",
        "catalyst-static:/srv/catalyst/static:ro"
      ],
      "tmpfs": [
        "/tmp:mode=1777,size=16m",
        "/data:uid=10001,gid=10001,mode=0700,size=16m",
        "/config:uid=10001,gid=10001,mode=0700,size=4m"
      ],
      "depends_on": {
        "web": {
          "condition": "service_started"
        },
        "collect-static": {
          "condition": "service_completed_successfully"
        }
      },
      "networks": [
        "edge"
      ],
      "restart": "unless-stopped"
    }
  },
  "networks": {
    "backend": {
      "internal": true
    },
    "fetch": {
      "internal": true
    },
    "edge": {},
    "egress": {}
  },
  "volumes": {
    "catalyst-db": {},
    "catalyst-run": {},
    "catalyst-static": {},
    "catalyst-mail": {},
    "catalyst-backups": {},
    "catalyst-custody": {},
    "catalyst-effects": {}
  },
  "secrets": {
    "secret_key": {
      "file": "${CATALYST_STAGING_SECRETS:?}/secret_key"
    },
    "verification_key": {
      "file": "${CATALYST_STAGING_SECRETS:?}/verification_key"
    },
    "verification_fallback_keys": {
      "file": "${CATALYST_STAGING_SECRETS:?}/verification_fallback_keys"
    },
    "admin_password": {
      "file": "${CATALYST_STAGING_SECRETS:?}/admin_password"
    },
    "owner_password": {
      "file": "${CATALYST_STAGING_SECRETS:?}/owner_password"
    },
    "app_password": {
      "file": "${CATALYST_STAGING_SECRETS:?}/app_password"
    },
    "retention_password": {
      "file": "${CATALYST_STAGING_SECRETS:?}/retention_password"
    },
    "backup_password": {
      "file": "${CATALYST_STAGING_SECRETS:?}/backup_password"
    },
    "fetcher_password": {
      "file": "${CATALYST_STAGING_SECRETS:?}/fetcher_password"
    }
  }
}
