{% extends "correspondence/staff/base.html" %}{% load correspondence_display %}
{% block content %}
<h1>Preview</h1>
<p>To: <bdi>{{ draft.recipient|visible }}</bdi> (the verified address)</p>
<p>Subject: <bdi>{{ draft.subject|visible }}</bdi></p>
<pre class="untrusted">{{ draft.body|visible }}</pre>
<form method="post" action="{% url 'correspondence_staff:confirm_message' draft.public_id %}">{% csrf_token %}
<input type="hidden" name="digest" value="{{ draft.content_sha256 }}">
<button>Confirm and send exactly this message</button></form>
<p><a href="{% url 'correspondence_staff:application' application.public_ref %}">Cancel</a></p>
{% endblock %}
